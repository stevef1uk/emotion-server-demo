apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: emotion-ingress
  labels:
    app: emotion-service
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
  - host: emotion-service-api.sjfisher.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: emotion-mcp
            port:
              number: 9000
      - path: /predict
        pathType: Prefix
        backend:
          service:
            name: emotion-mcp
            port:
              number: 8000
  tls:
  - hosts:
    - emotion-service-api.sjfisher.com
    secretName: emotion-service-api-tls
