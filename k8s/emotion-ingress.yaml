apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: emotion-ingress
  namespace: emotion
  labels:
    app: emotion-service
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
  - host: preprod.agw.sjfisher.com
    http:
      paths:
      - path: /api/emotion
        pathType: Prefix
        backend:
          service:
            name: emotion-web
            port:
              number: 8080
  - host: emotion-service-api.sjfisher.com
    http:
      paths:
      # Public Web UI fronted by the Go proxy pod
      - path: /
        pathType: Prefix
        backend:
          service:
            name: emotion-web
            port:
              number: 8080
      # Direct MCP Protocol endpoints for Claude Desktop, Agent Gateway, and agents
      - path: /mcp
        pathType: Prefix
        backend:
          service:
            name: emotion-mcp
            port:
              number: 9000
      - path: /sse
        pathType: Prefix
        backend:
          service:
            name: emotion-mcp
            port:
              number: 9000
      - path: /message
        pathType: Prefix
        backend:
          service:
            name: emotion-mcp
            port:
              number: 9000
      # Direct inference API
      - path: /predict
        pathType: Prefix
        backend:
          service:
            name: emotion-mcp
            port:
              number: 8000
  tls:
  - hosts:
    - emotion-service-api.sjfisher.com
    secretName: emotion-service-api-tls
