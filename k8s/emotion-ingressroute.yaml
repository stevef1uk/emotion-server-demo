apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: emotion-cors
  namespace: emotion
spec:
  headers:
    accessControlAllowMethods:
      - GET
      - POST
      - OPTIONS
    accessControlAllowOriginList:
      - "*"
    accessControlAllowHeaders:
      - "*"
    accessControlMaxAge: 86400
    addVaryHeader: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: emotion-rewrite
  namespace: emotion
spec:
  replacePathRegex:
    regex: "^/api/emotion/(.*)"
    replacement: "/api/$1"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: emotion-web-preprod
  namespace: emotion
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`preprod.agw.sjfisher.com`) && PathPrefix(`/api/emotion`)
      priority: 100
      kind: Rule
      middlewares:
        - name: emotion-cors
        - name: emotion-rewrite
      services:
        - name: emotion-web
          port: 8080
          namespace: emotion
